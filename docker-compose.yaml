services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: dbname
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: django:latest
    build:
        context: .
        dockerfile: Dockerfile
    ports:
        - "8000:8000"
    volumes:
        - .:/app
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/dbname
    depends_on:
      - db

  celery_worker:
    build: .
    container_name: celery_worker
    command: celery -A pythonProject11 worker --loglevel=info
    depends_on:
      - db

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A pythonProject11 beat --loglevel=info
    depends_on:
      - db

volumes:
  postgres_data: