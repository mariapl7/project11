services:
  db:
    container_name: db
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - ./.env

  web:
    image: django:latest
    build:
        context: .
        dockerfile: Dockerfile
    ports:
        - "8000:8000"
    volumes:
        - .:/app
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/dbname
    depends_on:
      - db

  redis:
      container_name: redis
      image: redis:latest
      ports:
        - "6379:6379"

  celery_worker:
    build: .
    container_name: celery_worker
    command: celery -A pythonProject11 worker --loglevel=info
    depends_on:
      - db

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A pythonProject11 beat --loglevel=info
    depends_on:
      - db
      - redis

volumes:
  postgres_data: