version: v2.34.0-desktop.1

services:
  backend:
    image: your_backend_image
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/dbname
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  celery:
    image: your_celery_image
    build:
      context: ./backend
    command: celery -A your_project_name worker --loglevel=info
    depends_on:
      - backend
      - redis

  celery_beat:
    image: your_celery_image
    build:
      context: ./backend
    command: celery -A your_project_name beat --loglevel=info
    depends_on:
      - backend

volumes:
  postgres_data:
